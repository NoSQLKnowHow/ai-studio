# AI Studio on the NVIDIA DGX Spark.
#
#   cp .env.example .env        # then set STUDIO_UID/STUDIO_GID (run: id -u; id -g)
#   mkdir -p data               # before the first start, so it's yours and not root's
#   docker compose up -d --build
#   open http://<spark-address>:8081
#
# Run docker compose as yourself, not with sudo: sudo changes $HOME, and with it the model cache
# folder below. README "Build and run on the DGX Spark" and docs/SPARK_TEST.md have the details.
name: ai-image-studio

services:
  studio:
    build:
      context: .
      args:
        NGC_TAG: ${NGC_TAG:-25.10-py3}
        SPEECH_VOXTRAL: ${SPEECH_VOXTRAL:-0}
        # The Video tab's program (LTX-2.5) built INTO the image, in an environment of its own: the second way, off unless asked for (several GB more; see "Video" in the README).
        # The first way needs no build at all: STUDIO_VIDEO_LTX_DIR shares the LTX-2 clone you already have (below). The commit is the one that was measured working on the Spark.
        VIDEO_LTX: ${VIDEO_LTX:-0}
        LTX_COMMIT: ${LTX_COMMIT:-daa6b16fc7f0f1628f2c9e36a303e3312b333cc6}
        LTX_PYTHON: ${LTX_PYTHON:-3.12}
        LTX_REPO: ${LTX_REPO:-https://github.com/Lightricks/LTX-2.git}
        LTX_UV_SYNC_ARGS: ${LTX_UV_SYNC_ARGS:-}
    image: ai-image-studio:local
    container_name: ai-image-studio
    restart: unless-stopped
    init: true  # reaps the image worker process if the server ever dies first

    # The GPU, the way NVIDIA's Spark instructions do it (docker run --runtime=nvidia --gpus=all).
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # NVIDIA's recommended settings for its PyTorch containers.
    shm_size: 2gb
    ulimits:
      memlock: -1
      stack: 67108864

    user: "${STUDIO_UID:-1000}:${STUDIO_GID:-1000}"
    extra_hosts:
      # So that STUDIO_OLLAMA_URL=http://host.docker.internal:11434 reaches an Ollama running on the Spark itself (Linux Docker has no such name of its own).
      - "host.docker.internal:host-gateway"
    ports:
      # STUDIO_BIND=127.0.0.1 keeps it off the LAN (for an SSH tunnel / NVIDIA Sync only).
      # The LEFT port is the one you open from outside, on the Spark's own address: 8081 unless STUDIO_PORT in .env says otherwise (a STUDIO_PORT=8080 left in an
      # older .env wins over this default, so change that line). The RIGHT port, 8080, is the one the image listens on inside the container and is not meant to change.
      - "${STUDIO_BIND:-0.0.0.0}:${STUDIO_PORT:-8081}:8080"
    volumes:
      - ./data:/data  # database, images, thumbnails
      # The Hugging Face cache, shared with anything else on the Spark that uses the default one
      # (Hermes' vLLM, the qwen_image.py script), so a model already downloaded isn't fetched again.
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/models
      # The Video tab (DESIGN.md section 46), both of them read-only and each at THE SAME PATH inside the container as on the Spark, so that what is recorded in them (the editable
      # installs of the LTX-2 clone name absolute paths under it) still points at things that exist, and so that a message that names a path names one you can find on the host.
      # Set the two in .env (README, Video) and run docker compose up -d again:
      #   STUDIO_VIDEO_LTX_DIR=/home/you/ltx-experiment/LTX-2        the LTX-2 clone with its .venv and packages/ (made with uv sync, where LTX was first run)
      #   STUDIO_VIDEO_MODELS_DIR=/home/you/ltx-experiment/models    diffusion_models, text_encoders, vae, latent_upscale_models, model_patches (71 GB; nothing is downloaded)
      # Both must be readable by STUDIO_UID:STUDIO_GID. Unset, each is an empty folder under ./data (so that compose works), and the Video tab says what is missing. The clone's
      # .venv/bin/python is a link to /usr/bin/python3, which the container has too (Ubuntu 24.04, Python 3.12.3): the host's environment runs as it is, with no rebuild.
      - ${STUDIO_VIDEO_LTX_DIR:-./data/video-env}:${STUDIO_VIDEO_LTX_DIR:-/opt/video-ltx-unset}:ro
      - ${STUDIO_VIDEO_MODELS_DIR:-./data/video-models}:${STUDIO_VIDEO_MODELS_DIR:-/opt/video-models-unset}:ro
    environment:
      STUDIO_MODEL: ${STUDIO_MODEL:-Qwen/Qwen-Image-2.1}
      STUDIO_MIN_FREE_GB: ${STUDIO_MIN_FREE_GB:-40}
      STUDIO_IDLE_TIMEOUT_MIN: ${STUDIO_IDLE_TIMEOUT_MIN:-30}
      STUDIO_CPU_OFFLOAD: ${STUDIO_CPU_OFFLOAD:-false}
      STUDIO_LOCAL_FILES_ONLY: ${STUDIO_LOCAL_FILES_ONLY:-auto}
      STUDIO_MUSIC_MODEL: ${STUDIO_MUSIC_MODEL:-MiniMaxAI/MiniMax-Music3}
      STUDIO_MUSIC_MIN_FREE_GB: ${STUDIO_MUSIC_MIN_FREE_GB:-40}
      STUDIO_MUSIC_MAX_SECONDS: ${STUDIO_MUSIC_MAX_SECONDS:-300}
      STUDIO_MUSIC_MAX_TRACKS: ${STUDIO_MUSIC_MAX_TRACKS:-4}
      STUDIO_ALLOWED_HOSTS: ${STUDIO_ALLOWED_HOSTS:-}
      STUDIO_QUEUE_CAP: ${STUDIO_QUEUE_CAP:-10}
      STUDIO_RETENTION_DAYS: ${STUDIO_RETENTION_DAYS:-30}
      STUDIO_BIN_DAYS: ${STUDIO_BIN_DAYS:-30}
      STUDIO_MAX_INPUT_IMAGES: ${STUDIO_MAX_INPUT_IMAGES:-4}
      STUDIO_UPLOAD_TTL_HOURS: ${STUDIO_UPLOAD_TTL_HOURS:-24}
      STUDIO_MAX_UPLOAD_MB: ${STUDIO_MAX_UPLOAD_MB:-20}
      STUDIO_DRAFT_SIZE: ${STUDIO_DRAFT_SIZE:-512}
      STUDIO_DRAFT_STEPS: ${STUDIO_DRAFT_STEPS:-12}
      STUDIO_EDIT_WARN_UNITS: ${STUDIO_EDIT_WARN_UNITS:-8}
      STUDIO_UPSCALER_MODEL: ${STUDIO_UPSCALER_MODEL:-}
      STUDIO_UPSCALER_DEVICE: ${STUDIO_UPSCALER_DEVICE:-auto}
      # The Prompt builder (the fourth tab, DESIGN.md section 37) talks to an Ollama server on your network. Empty address = the tab says how to set it up.
      STUDIO_OLLAMA_URL: ${STUDIO_OLLAMA_URL:-}
      STUDIO_OLLAMA_MODEL: ${STUDIO_OLLAMA_MODEL:-}
      STUDIO_OLLAMA_VISION_MODEL: ${STUDIO_OLLAMA_VISION_MODEL:-}
      STUDIO_OLLAMA_KEEP_ALIVE: ${STUDIO_OLLAMA_KEEP_ALIVE:-5m}
      STUDIO_OLLAMA_NUM_CTX: ${STUDIO_OLLAMA_NUM_CTX:-32768}
      STUDIO_OLLAMA_THINK: ${STUDIO_OLLAMA_THINK:-on}
      STUDIO_OLLAMA_TIMEOUT_S: ${STUDIO_OLLAMA_TIMEOUT_S:-120}
      STUDIO_OLLAMA_MAX_REPLY_S: ${STUDIO_OLLAMA_MAX_REPLY_S:-900}
      STUDIO_BUILDER_AT_ONCE: ${STUDIO_BUILDER_AT_ONCE:-1}
      # The Speech tab (the fifth, DESIGN.md section 38). Empty = the default (every engine; each engine's own model).
      STUDIO_SPEECH_ENGINES: ${STUDIO_SPEECH_ENGINES:-}
      STUDIO_SPEECH_QWEN3_TTS_MODEL: ${STUDIO_SPEECH_QWEN3_TTS_MODEL:-}
      STUDIO_SPEECH_VOXTRAL_MODEL: ${STUDIO_SPEECH_VOXTRAL_MODEL:-}
      STUDIO_SPEECH_KOKORO_MODEL: ${STUDIO_SPEECH_KOKORO_MODEL:-}
      STUDIO_SPEECH_PIPER_MODEL: ${STUDIO_SPEECH_PIPER_MODEL:-}
      STUDIO_SPEECH_MIN_FREE_GB: ${STUDIO_SPEECH_MIN_FREE_GB:-}
      STUDIO_SPEECH_GPU_FRACTION: ${STUDIO_SPEECH_GPU_FRACTION:-0.2}
      STUDIO_SPEECH_MAX_CHARS: ${STUDIO_SPEECH_MAX_CHARS:-1500000}
      STUDIO_SPEECH_PART_MAX_CHARS: ${STUDIO_SPEECH_PART_MAX_CHARS:-30000}
      STUDIO_SPEECH_MAX_UPLOAD_MB: ${STUDIO_SPEECH_MAX_UPLOAD_MB:-50}
      STUDIO_SPEECH_FETCH_MAX_MB: ${STUDIO_SPEECH_FETCH_MAX_MB:-5}
      STUDIO_SPEECH_FETCH_TIMEOUT_S: ${STUDIO_SPEECH_FETCH_TIMEOUT_S:-20}
      STUDIO_SPEECH_PAUSE_MS: ${STUDIO_SPEECH_PAUSE_MS:-450}
      STUDIO_SPEECH_VOICE_MIN_SECONDS: ${STUDIO_SPEECH_VOICE_MIN_SECONDS:-8}
      STUDIO_SPEECH_VOICE_MAX_SECONDS: ${STUDIO_SPEECH_VOICE_MAX_SECONDS:-60}
      STUDIO_SPEECH_RECORDING_MAX_MB: ${STUDIO_SPEECH_RECORDING_MAX_MB:-30}
      STUDIO_SPEECH_FFMPEG: ${STUDIO_SPEECH_FFMPEG:-ffmpeg}
      STUDIO_SPEECH_DECODE_TIMEOUT_S: ${STUDIO_SPEECH_DECODE_TIMEOUT_S:-30}
      STUDIO_SPEECH_TEMP_HOURS: ${STUDIO_SPEECH_TEMP_HOURS:-24}
      STUDIO_SPEECH_AUDIOBOOK_KBPS: ${STUDIO_SPEECH_AUDIOBOOK_KBPS:-64}
      # The Video tab (the sixth, DESIGN.md section 46): LTX-2.5, run as a program of its own for each clip. The two folders are the ones mounted above, at the same path; an empty
      # file name means "the one that looks right in its usual folder" (docs: README, Video). Unset: the Video tab says what to set.
      STUDIO_VIDEO_LTX_DIR: ${STUDIO_VIDEO_LTX_DIR:-}
      STUDIO_VIDEO_MODELS_DIR: ${STUDIO_VIDEO_MODELS_DIR:-}
      STUDIO_VIDEO_TRANSFORMER: ${STUDIO_VIDEO_TRANSFORMER:-}
      STUDIO_VIDEO_TEXT_ENCODER: ${STUDIO_VIDEO_TEXT_ENCODER:-}
      STUDIO_VIDEO_VIDEO_VAE: ${STUDIO_VIDEO_VIDEO_VAE:-}
      STUDIO_VIDEO_AUDIO_VAE: ${STUDIO_VIDEO_AUDIO_VAE:-}
      STUDIO_VIDEO_UPSAMPLER: ${STUDIO_VIDEO_UPSAMPLER:-}
      STUDIO_VIDEO_COMMAND: ${STUDIO_VIDEO_COMMAND:-}
      STUDIO_VIDEO_PYTHON: ${STUDIO_VIDEO_PYTHON:-}
      STUDIO_VIDEO_EXTRA_ARGS: ${STUDIO_VIDEO_EXTRA_ARGS:-}
      STUDIO_VIDEO_MIN_FREE_GB: ${STUDIO_VIDEO_MIN_FREE_GB:-60}
      STUDIO_VIDEO_MIN_FREE_DISK_GB: ${STUDIO_VIDEO_MIN_FREE_DISK_GB:-5}
      STUDIO_VIDEO_MAX_SECONDS: ${STUDIO_VIDEO_MAX_SECONDS:-30}
      STUDIO_VIDEO_QUANTIZATION: ${STUDIO_VIDEO_QUANTIZATION:-none}
      STUDIO_VIDEO_OFFLOAD: ${STUDIO_VIDEO_OFFLOAD:-none}
      STUDIO_VIDEO_TIMEOUT_MIN: ${STUDIO_VIDEO_TIMEOUT_MIN:-0}
      STUDIO_VIDEO_FFMPEG: ${STUDIO_VIDEO_FFMPEG:-ffmpeg}
      STUDIO_VIDEO_FFPROBE: ${STUDIO_VIDEO_FFPROBE:-ffprobe}
      STUDIO_VARIATIONS_FROM_PICTURE: ${STUDIO_VARIATIONS_FROM_PICTURE:-false}
      STUDIO_TAG_SUGGESTIONS: ${STUDIO_TAG_SUGGESTIONS:-5}
      HF_TOKEN: ${HF_TOKEN:-}
    # The server finishes or fails the current image and stops the worker cleanly on SIGTERM.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Deliberately absent: privileged mode, host networking and the Docker socket. The studio
    # cannot start, stop or reconfigure any other container (Hermes included).
